x-postgres-database: &postgres-database
  image: postgres:17-alpine
  environment: &postgres-environment
    POSTGRES_USER: happy-headlines
    POSTGRES_PASSWORD: happy-headlines
  healthcheck: &postgres-healthcheck
    interval: 2s
    timeout: 3s
    retries: 15

x-article-database: &article-database
  <<: *postgres-database
  environment:
    <<: *postgres-environment
    POSTGRES_DB: articles
  healthcheck:
    <<: *postgres-healthcheck
    test: ["CMD-SHELL", "pg_isready -U happy-headlines -d articles"]

services:
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  article-cache:
    image: redis:8-alpine

  comment-cache:
    image: redis:8-alpine

  rabbitmq:
    image: rabbitmq:management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: happy-headlines
      RABBITMQ_DEFAULT_PASS: happy-headlines
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    ports:
      - "18888:18888"
      - "4317:18889"

  seq:
    image: datalust/seq
    ports:
      - "5341:80"
    volumes:
      - seq-data:/data
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"

  publisher-service:
    image: publisher-service:latest
    ports:
      - "8085:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Seq__SeqUrl: http://seq
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__User: happy-headlines
      RabbitMQ__Password: happy-headlines

  newsletter-service:
    image: newsletter-service:latest
    ports:
      - "8084:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Seq__SeqUrl: http://seq
      ArticleClient__BaseUrl: http://article-service:8080
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__User: happy-headlines
      RabbitMQ__Password: happy-headlines

  draft-service:
    image: draft-service:latest
    ports:
      - "8083:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Seq__SeqUrl: http://seq
      DraftDatabase__Host: draft-database
      DraftDatabase__Name: drafts
      DraftDatabase__User: happy-headlines
      DraftDatabase__Password: happy-headlines

  profanity-service:
    image: profanity-service:latest
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ProfanityDatabase__Host: profanity-database
      ProfanityDatabase__Name: profanities
      ProfanityDatabase__User: happy-headlines
      ProfanityDatabase__Password: happy-headlines

  comment-service:
    image: comment-service:latest
    ports:
      - "8081:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      CommentCache__Host: comment-cache
      CommentCache__Port: 6379
      Seq__SeqUrl: http://seq
      ProfanityClient__BaseUrl: http://profanity-service:8080
      CommentDatabase__Host: comment-database
      CommentDatabase__Name: comments
      CommentDatabase__User: happy-headlines
      CommentDatabase__Password: happy-headlines

  article-service:
    image: article-service:latest
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ArticleCache__Host: article-cache
      ArticleCache__Port: 6379
      Seq__SeqUrl: http://seq
      RabbitMQ__Host: rabbitmq
      RabbitMQ__Port: 5672
      RabbitMQ__User: happy-headlines
      RabbitMQ__Password: happy-headlines
      ArticleDatabase__Africa__Host: article-database-africa
      ArticleDatabase__Antarctica__Host: article-database-antarctica
      ArticleDatabase__Asia__Host: article-database-asia
      ArticleDatabase__Europe__Host: article-database-europe
      ArticleDatabase__NorthAmerica__Host: article-database-north-america
      ArticleDatabase__Oceania__Host: article-database-oceania
      ArticleDatabase__SouthAmerica__Host: article-database-south-america
      ArticleDatabase__Global__Host: article-database-global
      ArticleDatabase__Name: articles
      ArticleDatabase__User: happy-headlines
      ArticleDatabase__Password: happy-headlines
    deploy:
      replicas: 3

  draft-database:
    <<: *postgres-database
    environment:
      <<: *postgres-environment
      POSTGRES_DB: drafts
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U happy-headlines -d drafts"]
    volumes:
      - draft-database-data:/var/lib/postgresql/data
      - ./DraftDatabase/init:/docker-entrypoint-initdb.d:ro

  profanity-database:
    <<: *postgres-database
    environment:
      <<: *postgres-environment
      POSTGRES_DB: profanities
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U happy-headlines -d profanities"]
    volumes:
      - profanity-database-data:/var/lib/postgresql/data
      - ./ProfanityDatabase/init:/docker-entrypoint-initdb.d:ro

  comment-database:
    <<: *postgres-database
    environment:
      <<: *postgres-environment
      POSTGRES_DB: comments
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U happy-headlines -d comments"]
    volumes:
      - comment-database-data:/var/lib/postgresql/data
      - ./CommentDatabase/init:/docker-entrypoint-initdb.d:ro
        
  article-database-africa:
    <<: *article-database
    volumes:
      - article-database-africa-data:/var/lib/postgresql/data
      - ./ArticleDatabase/init:/docker-entrypoint-initdb.d:ro

  article-database-antarctica:
    <<: *article-database
    volumes:
      - article-database-antarctica-data:/var/lib/postgresql/data
      - ./ArticleDatabase/init:/docker-entrypoint-initdb.d:ro

  article-database-asia:
    <<: *article-database
    volumes:
      - article-database-asia-data:/var/lib/postgresql/data
      - ./ArticleDatabase/init:/docker-entrypoint-initdb.d:ro

  article-database-europe:
    <<: *article-database
    volumes:
      - article-database-europe-data:/var/lib/postgresql/data
      - ./ArticleDatabase/init:/docker-entrypoint-initdb.d:ro

  article-database-north-america:
    <<: *article-database
    volumes:
      - article-database-north-america-data:/var/lib/postgresql/data
      - ./ArticleDatabase/init:/docker-entrypoint-initdb.d:ro

  article-database-oceania:
    <<: *article-database
    volumes:
      - article-database-oceania-data:/var/lib/postgresql/data
      - ./ArticleDatabase/init:/docker-entrypoint-initdb.d:ro

  article-database-south-america:
    <<: *article-database
    volumes:
      - article-database-south-america-data:/var/lib/postgresql/data
      - ./ArticleDatabase/init:/docker-entrypoint-initdb.d:ro

  article-database-global:
    <<: *article-database
    volumes:
      - article-database-global-data:/var/lib/postgresql/data
      - ./ArticleDatabase/init:/docker-entrypoint-initdb.d:ro

volumes:
  seq-data:
  rabbitmq-data:
  draft-database-data:
  profanity-database-data:
  comment-database-data:
  article-database-africa-data:
  article-database-antarctica-data:
  article-database-asia-data:
  article-database-europe-data:
  article-database-north-america-data:
  article-database-oceania-data:
  article-database-south-america-data:
  article-database-global-data: