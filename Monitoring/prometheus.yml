global:
  scrape_interval: 5s

scrape_configs:
  - job_name: article-service
    dns_sd_configs:
      - names:
          - tasks.article-service
        type: A
        port: 8080
        refresh_interval: 5s

  - job_name: comment-service
    static_configs:
      - targets: ["comment-service:8080"]