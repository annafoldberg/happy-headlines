# ArticleService CI workflow
# - Builds on pull requests and pushes to main.

name: ArticleService CI

on:
  push:
    branches:
      - main
    paths:
      - 'ArticleService/**'
      - 'Messaging/**'
      - 'Monitoring/**'
      - '.github/workflows/article-service-ci.yml'
      - '.github/workflows/article-service-cd.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ArticleService/**'
      - 'Messaging/**'
      - 'Monitoring/**'
      - '.github/workflows/article-service-ci.yml'
      - '.github/workflows/article-service-cd.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./ArticleService/ArticleService.csproj
          
      - name: Build
        run: dotnet build ./ArticleService/ArticleService.csproj -c Release --no-restore