# CommentService CD workflow
# - Runs after successful CI on main.
# - Builds and pushes a versioned Docker image to GitHub Container Registry.

name: CommentService CD

on:
  workflow_run:
    workflows: ["CommentService CI"]
    types:
      - completed
    branches:
      - main
    
permissions:
  contents: read
  packages: write

jobs:
  deliver:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7
        with:
          dotnet-version: '10.0.x'

      - name: Read version from project
        id: version
        run: |
          version=$(dotnet msbuild ./CommentService/CommentService.csproj -getProperty:Version)
          echo "tag=v$version" >> $GITHUB_OUTPUT

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./CommentService/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/commentservice:${{ steps.version.outputs.tag }}-${{ github.event.workflow_run.head_sha }}
            ghcr.io/${{ github.repository_owner }}/commentservice:latest